<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Marigold Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a phone-sized game cabinet (HUD on top, one view in the middle, tab bar below) centred on a dark backdrop.
   Look: walnut wood chrome with brass edges and lantern-gold accents; the map and stages are bright storybook village. */
:root{
  --wood:#26170e; --wood2:#3a2415; --wood3:#4d311c; --brass:#c9923a; --brass-d:#7d5518;
  --lantern:#ffbf47; --leaf:#8fbf5a; --brick:#e0482a; --sky:#5aa9d6; --rose:#e87ea1;
  --paper:#f3e4c4; --ink:#3a2616; --text:#f8eedb; --mute:#c3a98a;
  --display:'Gloock',Georgia,serif; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:#0e0805 radial-gradient(70% 50% at 50% 0%,#2b1a0f,transparent);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.35;overflow:hidden;padding:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--lantern);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}

#app{position:relative;margin:0 auto;height:100%;width:min(100%,1000px);display:flex;flex-direction:column;background:var(--wood);box-shadow:0 0 0 2px var(--brass-d),0 0 80px #000c;overflow:hidden}

/* HUD */
#hud{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(180deg,var(--wood3),var(--wood2));border-bottom:3px solid var(--brass-d)}
#hearts{display:flex;gap:2px;margin-right:auto}
#hearts svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#1a0f08;border:1px solid var(--brass-d);border-radius:999px;padding:3px 11px 3px 6px;font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.chip svg{width:18px;height:18px}
.ibtn{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#1a0f08;border:1px solid var(--brass-d)}
.ibtn svg{width:20px;height:20px}

/* views */
#views{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain}
#nav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:linear-gradient(180deg,var(--wood2),var(--wood));border-top:3px solid var(--brass-d);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{background:none;border:0;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:13px;color:var(--mute);letter-spacing:.04em;position:relative}
#nav svg{width:26px;height:26px}
#nav button[aria-current="page"]{color:var(--lantern)}
#nav button[aria-current="page"]::before{content:"";position:absolute;top:-3px;left:22%;right:22%;height:3px;background:var(--lantern);border-radius:2px}
#nav .dot{position:absolute;top:6px;left:58%;width:9px;height:9px;border-radius:50%;background:var(--brick)}

/* buttons */
.btn{background:linear-gradient(180deg,#ffd375,var(--lantern));color:#3a2200;border:0;border-bottom:4px solid var(--brass-d);border-radius:12px;padding:11px 20px 8px;font-weight:800;font-size:17px;letter-spacing:.02em}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.alt{background:linear-gradient(180deg,var(--wood3),var(--wood2));color:var(--text);border:1px solid var(--brass-d);border-bottom-width:4px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.sm{font-size:14px;padding:7px 14px 5px}

/* title */
#v-title{display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;background:linear-gradient(180deg,#14213d 0%,#2b3a67 38%,#e8985a 78%,#f6c177 100%);overflow:hidden}
#v-title .mid{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;padding:9vh 20px 0}
#v-title h1{font-size:clamp(50px,15vw,78px);line-height:.92;color:#fff4d6;text-shadow:0 4px 0 #7a3b12,0 0 36px rgba(255,191,71,.45)}
#v-title .tag{color:#fde7c0;font-weight:700;max-width:19em;text-shadow:0 1px 6px #0006}
#v-title .btns{display:flex;flex-direction:column;gap:10px;width:min(260px,100%);margin-top:8px}
#v-title svg.scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%;z-index:1}
.fly{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe9a0;box-shadow:0 0 10px 3px rgba(255,220,120,.7);animation:fly 6s ease-in-out infinite;z-index:2}
@keyframes fly{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(14px,-24px);opacity:1}}

/* map */
#v-map{overflow:hidden;background:linear-gradient(180deg,#8dc15f,#6fa853)}
#v-map svg{width:100%;height:100%;display:block}
.node{cursor:pointer}
.fogc{transition:opacity 1.2s}
@keyframes pulseR{0%,100%{opacity:.35}50%{opacity:.7}}
.zone{animation:pulseR 2.2s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.pin{animation:bob 1.2s infinite}
#marker{transition:transform 1s cubic-bezier(.5,0,.3,1)}
.mapbadge{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:center;pointer-events:none}
.mapbadge div{background:#1a0f08dd;border:1px solid var(--brass-d);border-radius:999px;padding:6px 16px;font-weight:800;font-size:14px;color:var(--lantern)}

/* journal + market */
#v-journal,#v-market{padding:14px max(14px,calc((100% - 560px)/2)) 20px;display:flex;flex-direction:column;gap:12px}
.page{background:var(--paper);color:var(--ink);border-radius:6px;padding:16px;box-shadow:0 3px 0 var(--brass-d),0 10px 24px #0008;background-image:repeating-linear-gradient(0deg,transparent 0 27px,rgba(120,80,30,.12) 27px 28px)}
.page h2{font-size:27px;color:#6a3a14}
.page p{font-weight:600}
.code{display:flex;gap:8px;justify-content:center;margin:6px 0}
.code span{width:42px;height:54px;display:grid;place-items:center;font-family:var(--display);font-size:32px;background:#fffaf0;border:3px solid #8b5a2b;border-radius:8px;color:#6a3a14}
.code span.q{color:#c9b28a}
.entry{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:center;padding:10px 0;border-top:2px dashed rgba(120,80,30,.35)}
.entry .ic{grid-row:span 2;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:19px;background:#d9c28f;color:#6a3a14}
.entry.done .ic{background:var(--leaf);color:#173a0a}
.entry.danger .ic{background:#f1b9a8;color:#7a1f0c}
.entry b{font-size:17px}
.entry small{font-weight:700;color:#7a5a38;font-size:14px}
.entry .st{color:#d18a00;letter-spacing:2px;font-size:15px;grid-row:span 2}
.shopitem{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;background:var(--wood2);border:1px solid var(--brass-d);border-radius:14px;padding:12px}
.shopitem .ico{width:48px;height:48px;border-radius:12px;background:#1a0f08;display:grid;place-items:center}
.shopitem .ico svg{width:30px;height:30px}
.shopitem h3{font-size:20px}
.shopitem p{color:var(--mute);font-size:14px;font-weight:600}
.sect{font-size:22px;color:var(--lantern)}

/* sheet */
#sheet{position:absolute;inset:0;z-index:40;background:rgba(10,5,2,.7);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
#sheet .card{width:min(100%,560px);max-height:92%;overflow:auto;background:linear-gradient(180deg,var(--wood3),var(--wood2));border-top:3px solid var(--brass);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet h2{font-size:30px;color:var(--lantern);line-height:1.05}
#sheet .sub{color:var(--mute);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:13px}
#sheet p{font-weight:600}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts div{background:#1a0f08;border:1px solid var(--brass-d);border-radius:10px;padding:8px 12px}
.facts b{display:block;font-size:20px}
.facts span{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;font-weight:800}
.bigstars{font-size:46px;letter-spacing:6px;color:var(--lantern);text-align:center;line-height:1}
.bigstars .off{color:#5a4128}
.bigstars span{display:inline-block;animation:pop .5s both}
.bigstars span:nth-child(2){animation-delay:.2s}.bigstars span:nth-child(3){animation-delay:.4s}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.clue{background:var(--paper);color:var(--ink);border-radius:6px;padding:12px 14px;font-weight:700;box-shadow:0 3px 0 var(--brass-d)}
.clue b{font-family:var(--display);font-size:22px;color:#a3330f}
.rowbtn{display:flex;gap:10px;flex-wrap:wrap}.rowbtn .btn{flex:1 1 40%}
.guide{display:flex;flex-direction:column;gap:10px}.guide h3{font-size:19px;color:var(--lantern);margin-top:4px}.guide p,.guide li{font-weight:600;font-size:15px}.guide ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}.guide kbd{background:#1a0f08;border:1px solid var(--brass-d);border-bottom-width:3px;border-radius:6px;padding:0 6px;font-family:inherit;font-weight:800}

/* stage shell */
#v-stage{display:flex;flex-direction:column;overflow:hidden;background:#2a3a22}
#stageHead{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--wood2);border-bottom:2px solid var(--brass-d)}
#stageHead .t{flex:1;min-width:0}
#stageHead h2{font-size:21px;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stageHead small{display:block;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
#stageHead small.dz{color:#ff8b6e}
#stageInfo{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;min-width:56px;text-align:right}
#stageBody{position:relative;flex:1;min-height:0;overflow:hidden}
.pz{position:absolute;inset:0;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px;background:linear-gradient(180deg,#3d2a1a,#2b1c10)}
canvas.cv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;touch-action:none;background:#1c2a17}
.flash{position:absolute;inset:0;background:rgba(255,60,40,.35);pointer-events:none;opacity:0;transition:opacity .35s}
.flash.on{opacity:1;transition:none}
#pauseOv{position:absolute;inset:0;z-index:5;background:rgba(10,5,2,.78);display:grid;place-items:center;font-family:var(--display);font-size:34px;color:var(--lantern);text-align:center;gap:8px}
.stick{position:absolute;left:18px;bottom:22px;width:120px;height:120px;border-radius:50%;background:rgba(255,245,220,.14);border:2px solid rgba(255,245,220,.4);touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(255,245,220,.6)}
.dpad{position:absolute;right:14px;bottom:20px;display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px}
.dpad button{border-radius:14px;background:rgba(26,15,8,.8);border:2px solid var(--brass);font-size:24px;font-weight:800;color:var(--lantern)}
.dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .d{grid-column:2;grid-row:2}.dpad .r{grid-column:3;grid-row:2}
.hintline{font-weight:800;color:var(--lantern);text-align:center;min-height:22px;font-size:15px}
.pzbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* word search */
.wsg{display:grid;gap:2px;width:min(100%,420px,52vh);aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}
.wsg div{display:grid;place-items:center;background:var(--paper);color:var(--ink);font-weight:800;border-radius:4px;font-size:clamp(14px,4.4vw,21px);transition:background .1s}
.wsg div.sel{background:var(--lantern)}
.wsg div.fnd{background:var(--wc,var(--leaf));color:#10240a}
.wsg div.hn{background:#fff;box-shadow:0 0 0 3px var(--brick) inset}
.words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.words span{font-weight:800;font-size:15px;letter-spacing:.06em;background:#1a0f08;border:1px solid var(--brass-d);border-radius:8px;padding:3px 10px}
.words span.ok{text-decoration:line-through;color:var(--leaf);border-color:var(--leaf)}
/* unscramble */
.slots,.tiles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.slots i,.tiles button{width:clamp(34px,10vw,46px);height:clamp(42px,12vw,56px);display:grid;place-items:center;border-radius:8px;font-family:var(--display);font-size:clamp(20px,6vw,28px);font-style:normal}
.slots i{background:#1a0f08;border:2px dashed var(--brass-d);color:var(--lantern)}
.slots i.f{border-style:solid;border-color:var(--lantern)}
.slots.ok i{background:var(--leaf);color:#10240a;border-color:var(--leaf)}
.tiles button{background:var(--paper);color:var(--ink);border:0;border-bottom:4px solid #9b7a45}
.tiles button.used{opacity:.25;pointer-events:none}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.big{font-family:var(--display);font-size:24px}
/* memory */
.mill{position:relative;width:min(100%,360px);aspect-ratio:1;flex:none}
.pad{position:absolute;width:46%;height:46%;border-radius:50% 50% 50% 8%;border:4px solid rgba(0,0,0,.35);opacity:.55;transition:opacity .1s,transform .1s,filter .1s}
.pad.lit{opacity:1;transform:scale(1.06);filter:brightness(1.4) drop-shadow(0 0 16px currentColor)}
.pad:nth-child(1){left:2%;top:2%;background:var(--lantern);color:var(--lantern);border-radius:50% 8% 50% 50%}
.pad:nth-child(2){right:2%;top:2%;background:var(--leaf);color:var(--leaf);border-radius:8% 50% 50% 50%}
.pad:nth-child(3){left:2%;bottom:2%;background:var(--sky);color:var(--sky);border-radius:50% 50% 8% 50%}
.pad:nth-child(4){right:2%;bottom:2%;background:var(--rose);color:var(--rose);border-radius:50% 50% 50% 8%}
.hub{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;margin:-11% 0 0 -11%;border-radius:50%;background:var(--wood);border:4px solid var(--brass);display:grid;place-items:center;font-family:var(--display);font-size:22px;pointer-events:none}
/* wordle */
.wg{display:grid;grid-template-rows:repeat(6,1fr);gap:5px;width:min(100%,290px);flex:none}
.wg div{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.wg i{aspect-ratio:1;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:26px;background:#1a0f08;border:2px solid var(--wood3);border-radius:6px;color:var(--text)}
.wg i.t{border-color:var(--mute)}
.wg i.g{background:var(--leaf);color:#10240a;border-color:var(--leaf)}
.wg i.y{background:var(--lantern);color:#3a2200;border-color:var(--lantern)}
.wg i.x{background:#4a3a2c;border-color:#4a3a2c;color:var(--mute)}
.kb{display:flex;flex-direction:column;gap:6px;width:100%;max-width:420px}
.kb div{display:flex;gap:4px;justify-content:center}
.kb button{flex:1;max-width:40px;height:44px;border-radius:7px;border:0;border-bottom:3px solid #9b7a45;background:var(--paper);color:var(--ink);font-weight:800;padding:0}
.kb button.w{max-width:62px;font-size:13px}
.kb button.g{background:var(--leaf)}.kb button.y{background:var(--lantern)}.kb button.x{background:#4a3a2c;color:var(--mute);border-color:#2a1d12}
/* forge */
.fg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(100%,330px);aspect-ratio:1;padding:10px;background:#1a0f08;border:3px solid var(--brass-d);border-radius:14px;flex:none}
.fg button{border:0;border-radius:10px;font-family:var(--display);font-size:clamp(30px,10vw,44px);background:linear-gradient(145deg,#8a8f98,#4d525b);color:#f2f4f7;border-bottom:5px solid #2d3036;position:relative}
.fg button::before,.fg button::after{content:"";position:absolute;top:7px;width:7px;height:7px;border-radius:50%;background:#2d3036}
.fg button::before{left:7px}.fg button::after{right:7px}
.fg button.e{background:radial-gradient(circle,#ff9a3c,#8a2c0a);border-color:#4a1604;pointer-events:none;box-shadow:0 0 22px #ff7a1a inset}
.fg button.e::before,.fg button.e::after{display:none}
.fg button.hn{outline:4px solid var(--lantern)}
/* lock */
.dials{display:flex;gap:8px;justify-content:center}
.dial{display:flex;flex-direction:column;align-items:center;gap:6px}
.dial button.a{width:44px;height:34px;border-radius:8px;border:0;background:var(--brass);color:#3a2200;font-weight:800;font-size:18px}
.dial output{width:44px;height:62px;display:grid;place-items:center;font-family:var(--display);font-size:38px;background:var(--paper);color:var(--ink);border-radius:8px;border:3px solid #8b5a2b}
#toast{position:absolute;left:50%;bottom:76px;transform:translate(-50%,16px);background:var(--lantern);color:#3a2200;font-weight:800;padding:9px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* finale */
#v-final{display:flex;flex-direction:column;align-items:center;gap:14px;padding:22px 18px;text-align:center;background:radial-gradient(80% 50% at 50% 30%,#6b4a14,#26170e 70%)}
#v-final canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#v-final h1{font-size:44px;color:var(--lantern);position:relative}
#v-final>*{position:relative}
.chest{width:150px;height:110px;position:relative;margin:6px 0}
.chest .base{position:absolute;left:0;right:0;bottom:0;height:62px;background:linear-gradient(180deg,#a56a35,#7a4720);border:4px solid #3d2008;border-radius:6px 6px 10px 10px}
.chest .base::after{content:"";position:absolute;left:0;right:0;top:14px;height:12px;background:var(--lantern);border-block:3px solid var(--brass-d)}
.chest .lid{position:absolute;left:0;right:0;bottom:56px;height:44px;background:linear-gradient(180deg,#bf8043,#8c5528);border:4px solid #3d2008;border-radius:40px 40px 4px 4px;transform-origin:left bottom;transition:transform 1.2s cubic-bezier(.3,1.4,.5,1);transform:rotate(-78deg)}
.chest .gold{position:absolute;left:8px;right:8px;bottom:48px;height:26px;background:radial-gradient(circle at 30% 30%,#fff3b0,var(--lantern) 60%,var(--brass-d));border-radius:50% 50% 10% 10%;box-shadow:0 0 40px 14px rgba(255,191,71,.6)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}

/* ---- v2: full-screen, points, 3D feel ---- */
#app{width:100%;box-shadow:none}
@media(min-width:700px){#sheet{align-items:center}#sheet .card{border-radius:22px;border:3px solid var(--brass)}}
#hearts svg{width:20px;height:20px}
.chip{padding:3px 10px 3px 5px;font-size:14px}
.ibtn.off{opacity:.5}
#stageHint{position:relative}
.bdg{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;background:var(--lantern);color:#3a2200;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 4px}
@media(max-width:400px){#hearts svg{width:16px;height:16px}.ibtn{width:30px;height:30px}.chip{font-size:13px;padding:2px 7px 2px 4px}#hud{gap:6px;padding:8px}}
.ptpop{position:absolute;left:50%;top:38%;font-family:var(--display);font-size:30px;color:var(--lantern);text-shadow:0 3px 0 #6b4605,0 0 14px #000;pointer-events:none;animation:ptfloat 1.5s ease-out forwards;z-index:6;white-space:nowrap}
@keyframes ptfloat{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = (s,r=document) => r.querySelector(s), $$ = (s,r=document) => [...r.querySelectorAll(s)];
const clamp = (v,a,b) => Math.max(a,Math.min(b,v)), rnd = (a,b) => a+Math.random()*(b-a), ri = (a,b) => Math.floor(rnd(a,b+1)), pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const isTouch = (window.matchMedia&&matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;

/* ============ save ============ */
const KEY='marigold-trail-v1';
const def = () => ({step:0,hearts:5,coins:30,hints:2,shields:0,stars:{},sound:true,assist:false,music:true,points:0,seen:false,started:false,done:false,seenJ:0});
function load(){ try{ const r=localStorage.getItem(KEY); if(r) return Object.assign(def(),JSON.parse(r)); }catch(e){} return def(); }
let S = load();
const persist = () => { try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };

/* ============ sound ============ */
let AC=null;
const ac = () => { if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume().catch(()=>{}); return AC; };
function tone(f,d=.12,type='sine',vol=.1,slide=0,delay=0){
  if(!S.sound) return; const a=ac(); if(!a) return; const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.03);
}
function noise(d=.15,vol=.08,fr=900){
  if(!S.sound) return; const a=ac(); if(!a) return; const n=Math.floor(a.sampleRate*d), b=a.createBuffer(1,n,a.sampleRate), D=b.getChannelData(0);
  for(let i=0;i<n;i++) D[i]=(Math.random()*2-1)*(1-i/n); const s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain();
  s.buffer=b; f.type='lowpass'; f.frequency.value=fr; g.gain.value=vol; s.connect(f); f.connect(g); g.connect(a.destination); s.start();
}
const sfx = {
  tap:()=>tone(560,.05,'triangle',.05), good:()=>{tone(660,.08,'triangle',.09);tone(990,.14,'triangle',.09,0,.07);},
  bad:()=>tone(150,.25,'sawtooth',.09,-80), coin:()=>{tone(988,.06,'square',.04);tone(1319,.12,'square',.04,0,.06);},
  hurt:()=>{tone(180,.3,'sawtooth',.1,-110);noise(.2,.08,500);}, splash:()=>noise(.35,.1,1800), rock:()=>noise(.3,.14,300), growl:()=>tone(90,.3,'sawtooth',.05,-30),
  creak:()=>tone(220,.08,'square',.03,-60), hop:()=>tone(420,.07,'triangle',.06,200),
  win:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.2,'triangle',.1,0,i*.09)),
  lose:()=>[330,277,220,165].forEach((f,i)=>tone(f,.28,'sawtooth',.07,0,i*.15)),
  pad:i=>tone([262,330,392,523][i],.28,'triangle',.12), buy:()=>{tone(784,.07,'square',.05);tone(1047,.07,'square',.05,0,.07);tone(1319,.16,'square',.05,0,.14);}
};

/* ============ mysterious background music (generated) ============ */
const Music={on:false,a:null,out:null,bus:null,timer:null,mood:'calm',nC:0,nN:0,nB:0,ci:0,nodes:[],
  start(){
    if(!S.music||this.on) return; const a=ac(); if(!a) return; this.a=a; this.on=true;
    const out=a.createGain(); out.gain.value=0; out.gain.linearRampToValueAtTime(.5,a.currentTime+3); out.connect(a.destination); this.out=out;
    const len=Math.floor(a.sampleRate*3), ir=a.createBuffer(2,len,a.sampleRate); for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4); }
    const conv=a.createConvolver(); conv.buffer=ir; const wet=a.createGain(); wet.gain.value=.6; conv.connect(wet); wet.connect(out);
    const dry=a.createGain(); dry.gain.value=.65; dry.connect(out); const bus=a.createGain(); bus.connect(dry); bus.connect(conv); this.bus=bus;
    const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=260; lp.connect(bus);
    [[55,'triangle',.22],[82.41,'sine',.12],[110.2,'sine',.06]].forEach(([f,ty,v])=>{ const o=a.createOscillator(); o.type=ty; o.frequency.value=f; const g=a.createGain(); g.gain.value=v; o.connect(g); g.connect(lp); o.start(); this.nodes.push(o); });
    const lfo=a.createOscillator(); lfo.frequency.value=.07; const lg=a.createGain(); lg.gain.value=110; lfo.connect(lg); lg.connect(lp.frequency); lfo.start(); this.nodes.push(lfo);
    const t=a.currentTime; this.nC=t+.2; this.nN=t+2.5; this.nB=t+1; this.timer=setInterval(()=>this.tick(),250);
  },
  tick(){
    const a=this.a; if(!a||a.state!=='running'||!this.on) return; const t=a.currentTime;
    if(t+.6>=this.nC){ const s=Math.max(t,this.nC); this.chord(s); this.nC=s+9; }
    if(t+.6>=this.nN){ const s=Math.max(t,this.nN); this.note(s); this.nN=s+(this.mood==='tense'?rnd(.7,1.4):rnd(1.4,3.4)); }
    if(this.mood==='tense'&&t+.6>=this.nB){ const s=Math.max(t,this.nB); this.beat(s); this.nB=s+.95; }
  },
  chord(t){
    const a=this.a, CH=[[110,130.8,164.8,196],[87.3,110,130.8,164.8],[73.4,87.3,110,130.8],[82.4,103.8,123.5,146.8]]; const c=CH[this.ci=(this.ci+1)%4];
    c.forEach((f,i)=>{ const o=a.createOscillator(), g=a.createGain(), lp=a.createBiquadFilter(); o.type='sawtooth'; o.frequency.value=f; o.detune.value=(i-1.5)*7; lp.type='lowpass'; lp.frequency.value=650;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.034,t+3); g.gain.setValueAtTime(.034,t+5.2); g.gain.linearRampToValueAtTime(0,t+8.8); o.connect(lp); lp.connect(g); g.connect(this.bus); o.start(t); o.stop(t+9); });
  },
  note(t){
    const a=this.a, SC=[440,493.9,523.3,659.3,698.5,784,880,987.8]; let f=pick(SC); if(this.mood==='tense') f=pick([220,233.1,261.6,329.6,349.2]);
    [[f,.085],[f*2.76,.03]].forEach(([fr,v])=>{ const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.value=fr; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+3.2); o.connect(g); g.connect(this.bus); o.start(t); o.stop(t+3.3); });
  },
  beat(t){
    const a=this.a; [[0,.4],[.24,.25]].forEach(([d,v])=>{ const o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(70,t+d); o.frequency.exponentialRampToValueAtTime(38,t+d+.25); g.gain.setValueAtTime(v,t+d); g.gain.exponentialRampToValueAtTime(.0001,t+d+.3); o.connect(g); g.connect(this.out); o.start(t+d); o.stop(t+d+.35); });
  },
  setMood(m){ this.mood=m; },
  stop(){ if(!this.on) return; this.on=false; clearInterval(this.timer); const a=this.a, o=this.out, nodes=this.nodes; this.nodes=[]; try{ o.gain.cancelScheduledValues(a.currentTime); o.gain.setValueAtTime(o.gain.value,a.currentTime); o.gain.linearRampToValueAtTime(0,a.currentTime+.6); }catch(e){} setTimeout(()=>{ nodes.forEach(n=>{ try{ n.stop(); }catch(e){} }); try{ o.disconnect(); }catch(e){} },900); }
};
function toggleMusic(){ S.music=!S.music; persist(); if(S.music) Music.start(); else Music.stop(); $('#mus')&&$('#mus').classList.toggle('off',!S.music); toast('Music '+(S.music?'on':'off')); }

/* ============ story data ============ */
const STEPS = [
  {id:'barn',kind:'puzzle',name:'The Barn Loft',short:'Barn',x:62,y:570,digit:4,clue:'Grandfather scratched a number into the hayloft beam: FOUR.',
   brief:'Grandfather hid a word trail in the hay. Drag across the letters to circle each word in the list. Words run in any direction, even backwards.'},
  {id:'field',kind:'danger',name:'Bramble Field',short:'Brambles',x:150,y:518,
   brief:'Crows rule the old farmland. Cross to the gate at the top. Thorns and crows each cost a heart. Gather coins on the way. You have 60 seconds.',ctl:'Move: WASD or arrows, or the stick.'},
  {id:'well',kind:'puzzle',name:'The Old Well',short:'Well',x:252,y:468,digit:1,clue:'Chalk marks on the well bucket: just ONE stroke.',
   brief:'The well stones have been scrambled. Rebuild four village words from their jumbled letters. Wrong answers cost 5 seconds.'},
  {id:'bridge',kind:'danger',name:'Rickety Bridge',short:'Bridge',x:278,y:402,
   brief:'The river bridge is rotten. Planks drop out and return on a timer. Hop forward onto a solid plank and keep moving. The rest stones are safe. Falling costs a heart.',ctl:'Hop: arrows or WASD, swipe, or the pad.'},
  {id:'mill',kind:'puzzle',name:'The Windmill',short:'Windmill',x:192,y:336,digit:7,clue:'Seven lanterns hang from the windmill blades: SEVEN.',
   brief:'The windmill gears answer to lantern light. Watch the pattern, then repeat it. Be quick. A wrong or slow tap jams the gears and costs a heart.'},
  {id:'woods',kind:'danger',name:'Whispering Woods',short:'Woods',x:84,y:288,
   brief:'The woods are dark and wolves prowl the paths. Follow the golden glow to the far gate. Your lantern only shows a short way. Wolves cost a heart. You have 90 seconds.',ctl:'Move: WASD or arrows, or the stick.'},
  {id:'bell',kind:'puzzle',name:'The Bell Tower',short:'Bell tower',x:132,y:216,digit:3,clue:'The tower rings THREE chimes at the hour.',
   brief:'Guess the secret five-letter word in six tries. Green means right spot. Gold means wrong spot. Grey means not in the word. Any five letters are accepted.'},
  {id:'pass',kind:'danger',name:'Rockfall Pass',short:'Rockfall',x:232,y:170,
   brief:'Rocks tumble from the cliffs. A red circle shows where each one will land. Step out of it. Watch for rolling boulders. Survive 40 seconds to cross.',ctl:'Move: WASD or arrows, or the stick.'},
  {id:'forge',kind:'puzzle',name:'The Blacksmith',short:'Forge',x:292,y:112,digit:9,clue:'NINE horseshoes hang above the forge.',
   brief:'Slide the iron plates to put them in order, 1 to 8, with the glowing gap in the corner. Tap a plate next to the gap.'},
  {id:'oak',kind:'final',name:'The Big Oak',short:'Big Oak',x:180,y:52,
   brief:'Five brass dials guard the roots. Grandfather’s digits, in the order you found them, open the lock.'}
];
const CODE = STEPS.filter(s=>s.digit).map(s=>s.digit).join('');
const MAXH = 5;
const HINTS={
 barn:'The gold lies north of the barn, on the far side of the river.',
 field:'It sleeps beneath a tree older than the village itself.',
 well:'Look for the oldest tree on the highest ground, where the trail ends.',
 bridge:'Past the river, the trail climbs through a windmill, a dark wood and a bell tower.',
 mill:'Seven turns of the windmill point north-west. The woods come next.',
 woods:'Beyond the woods the bell tower rings over the path to the oak.',
 bell:'Only falling stones and a forge stand between you and the tree.',
 pass:'The forge smoke drifts straight toward the Big Oak.',
 forge:'The Big Oak is next. Five dials, five digits, one chest of gold.'};
STEPS.forEach(s=>{ s.hint=HINTS[s.id]; });
const RANKS=[[0,'Rookie Digger'],[300,'Village Scout'],[700,'Trail Tracker'],[1200,'Treasure Hunter'],[1900,'Master Explorer'],[2800,'Village Legend']];
const rankOf=p=>{ let r=RANKS[0][1]; for(const [n,t] of RANKS) if(p>=n) r=t; return r; };
const nextRank=p=>RANKS.find(r=>r[0]>p);
function addPoints(n){ const b=rankOf(S.points); S.points+=n; persist(); hud(); if(rankOf(S.points)!==b) setTimeout(()=>toast('Rank up: '+rankOf(S.points)+'!'),600); }
function countUp(el,to){ if(!el) return; const t0=performance.now(), d=900; const f=now=>{ const k=Math.min(1,(now-t0)/d); el.textContent='+'+Math.round(to*(1-Math.pow(1-k,3))); if(k<1&&document.body.contains(el)) requestAnimationFrame(f); }; requestAnimationFrame(f); }

/* ============ icons ============ */
const heartSvg = on => '<svg viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.8-8 11-8 11z" fill="'+(on?'#e0482a':'#1a0f08')+'" stroke="'+(on?'#7a1f0c':'#7d5518')+'" stroke-width="2"/></svg>';
const ICO = {
  hint:'<svg viewBox="0 0 24 24"><path d="M6 4h11a2 2 0 0 1 2 2v11a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3V5a1 1 0 0 1 1-1z" fill="#f3e4c4" stroke="#7d5518" stroke-width="2"/><path d="M9 9h6M9 13h6" stroke="#7d5518" stroke-width="2"/></svg>',
  heart:heartSvg(true),
  shield:'<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z" fill="#5aa9d6" stroke="#1d4f73" stroke-width="2"/><path d="M12 7v10" stroke="#1d4f73" stroke-width="2"/></svg>',
  potion:'<svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v5l-5 9a3 3 0 0 0 3 4h8a3 3 0 0 0 3-4l-5-9V3" fill="#e0482a" stroke="#7a1f0c" stroke-width="2"/></svg>'
};

/* ============ shell ============ */
let view='title', modalOpen=false;
function hud(){
  $('#hearts').innerHTML = Array.from({length:MAXH},(_,i)=>heartSvg(i<S.hearts)).join('');
  $('#hCoins').textContent=S.coins; $('#hHints').textContent=S.hints; $('#hPts').textContent=S.points; const hn=$('#hintN'); if(hn) hn.textContent=S.hints; const mu=$('#mus'); if(mu) mu.classList.toggle('off',!S.music);
  const nj = S.step>S.seenJ; $('#jdot').hidden=!nj;

    for(const w of wolves){ g.save(); g.translate(w.x,w.y); g.fillStyle='rgba(0,0,0,.3)'; g.beginPath(); g.ellipse(0,9,13,4,0,0,7); g.fill(); g.fillStyle='#4a4f5a'; g.beginPath(); g.ellipse(0,0,14,9,0,0,7); g.fill(); g.beginPath(); g.moveTo(-4,-8); g.lineTo(-8,-15); g.lineTo(0,-9); g.moveTo(4,-8); g.lineTo(8,-15); g.lineTo(0,-9); g.fill(); g.restore(); }
    villager(g,p.x,p.y,p.fx,p.walk,p.inv,t); g.restore();
    const lx=p.x-camx, ly=p.y-camy, fl=1+Math.sin(t*6)*.02, gr=g.createRadialGradient(lx,ly,110*fl,lx,ly,250*fl); gr.addColorStop(0,'rgba(3,8,6,0)'); gr.addColorStop(1,'rgba(3,8,6,.9)'); g.fillStyle=gr; g.fillRect(0,0,VW,VH);
    g.globalCompositeOperation='lighter';
    for(const f of flies){ f.x+=Math.sin(t*f.s+f.ph)*14*dt; f.y+=Math.cos(t*f.s*1.3+f.ph)*10*dt; const sx=f.x-camx, sy2=f.y-camy; if(sx<-10||sx>VW+10||sy2<-10||sy2>VH+10) continue; const a=.5+.5*Math.sin(t*2+f.ph); const fg=g.createRadialGradient(sx,sy2,0,sx,sy2,9); fg.addColorStop(0,'rgba(255,240,150,'+(.9*a)+')'); fg.addColorStop(1,'rgba(255,240,150,0)'); g.fillStyle=fg; g.fillRect(sx-9,sy2-9,18,18); }
    const ex=exit.x-camx, ey=exit.y-camy; const eg=g.createRadialGradient(ex,ey,2,ex,ey,60+Math.sin(t*4)*6); eg.addColorStop(0,'rgba(255,210,100,.95)'); eg.addColorStop(1,'rgba(255,190,70,0)'); g.fillStyle=eg; g.fillRect(ex-70,ey-70,140,140);
    g.globalCompositeOperation='source-over'; g.fillStyle='#ffbf47'; g.fillRect(ex-9,ey-13,18,26); g.fillStyle='#6b4421'; g.fillRect(ex-13,ey-15,5,30); g.fillRect(ex+8,ey-15,5,30);
    g.fillStyle='#ff4d3a'; for(const w of wolves){ const sx=w.x-camx, sy2=w.y-camy; if(Math.hypot(sx-lx,sy2-ly)<290){ g.beginPath(); g.arc(sx-4,sy2-2,2,0,7); g.arc(sx+4,sy2-2,2,0,7); g.fill(); } }
    if(ex<0||ex>VW||ey<0||ey>VH){ const a=Math.atan2(exit.y-p.y,exit.x-p.x); g.save(); g.translate(lx+Math.cos(a)*54,ly+Math.sin(a)*54); g.rotate(a); g.fillStyle='#ffbf47'; g.beginPath(); g.moveTo(10,0); g.lineTo(-6,-7); g.lineTo(-6,7); g.fill(); g.restore(); }
    bar(g,VW,1-Math.hypot(p.x-exit.x,p.y-exit.y)/Math.hypot(exit.x-1.5*TS,exit.y-1.5*TS));
  });
  cx.dbg={p,wolves,exit,M,TS};
}

/* ============ danger: rockfall pass ============ */
function stageRocks(host,cx){
  const {c,g,W,H}=makeCanvas(host,560), stick=cx.stick(host); const p={x:W/2,y:H*.78,fx:1,walk:0,inv:0}; let t=0,got=0,spawnT=1.2,boulderT=7; const DUR=S.assist?24:32, WARN=1.15;
  const rocks=[], rubble=[], boulders=[], pick2=[], parts=[]; let shake=0;
  const dust=Array.from({length:40},()=>({x:rnd(0,W),y:rnd(0,H),v:rnd(6,20),r:rnd(1,2.6),ph:rnd(0,6)})), birds=Array.from({length:3},()=>({x:rnd(0,W),y:rnd(40,160),v:rnd(20,40),ph:rnd(0,6)}));
  const sp=150;
  cx.loop(dt=>{
    t+=dt; p.inv=Math.max(0,p.inv-dt); shake=Math.max(0,shake-dt*30); if(t>=DUR){ cx.win({stars:cx.lostStars(),coins:got}); return; } cx.info(Math.ceil(DUR-t)+'s');
    const [mx,my]=cx.move(stick); if(mx||my){ p.walk+=dt*12; if(mx) p.fx=mx>0?1:-1; p.x=clamp(p.x+mx*sp*dt,16,W-16); p.y=clamp(p.y+my*sp*dt,250,H-24); }
    spawnT-=dt; if(spawnT<=0){ spawnT=Math.max(S.assist?.8:.6,(S.assist?1.7:1.35)-t*.012); const near=Math.random()<.4; rocks.push({x:near?clamp(p.x+rnd(-60,60),24,W-24):rnd(24,W-24),y:near?clamp(p.y+rnd(-60,60),230,H-20):rnd(230,H-30),r:rnd(24,34),life:0,warn:WARN}); if(Math.random()<.22) pick2.push({x:rnd(30,W-30),y:rnd(300,H-40),ph:rnd(0,6),life:8}); }
    boulderT-=dt; if(boulderT<=0){ boulderT=11; const dir=Math.random()<.5?1:-1; boulders.push({y:rnd(320,500),dir,x:dir>0?-30:W+30,warn:1.6,r:22}); }
    for(const r of rocks){ r.life+=dt; if(!r.done&&r.life>=r.warn){ r.done=true; shake=8; sfx.rock(); for(let k=0;k<14;k++) parts.push({x:r.x,y:r.y,vx:rnd(-110,110),vy:rnd(-130,-20),l:.7}); rubble.push({x:r.x,y:r.y,r:r.r*.7,l:3}); if(p.inv<=0&&Math.hypot(p.x-r.x,p.y-r.y)<r.r+6){ p.inv=2; cx.hurt(); } } }
    for(let i=rocks.length-1;i>=0;i--) if(rocks[i].done&&rocks[i].life>rocks[i].warn+.1) rocks.splice(i,1);
    for(const b of boulders){ if(b.warn>0){ b.warn-=dt; if(b.warn<=0) sfx.rock(); } else { b.x+=b.dir*230*dt; if(p.inv<=0&&Math.hypot(p.x-b.x,p.y-b.y)<b.r+8){ p.inv=2; cx.hurt(); } } }
    for(let i=boulders.length-1;i>=0;i--) if(boulders[i].x<-60||boulders[i].x>W+60) boulders.splice(i,1);
    for(let i=pick2.length-1;i>=0;i--){ const k=pick2[i]; k.life-=dt; if(k.life<=0){ pick2.splice(i,1); continue; } if(Math.hypot(p.x-k.x,p.y-k.y)<18){ pick2.splice(i,1); got+=2; sfx.coin(); } }
    for(const q of parts){ q.l-=dt; q.vy+=300*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; } for(let i=parts.length-1;i>=0;i--) if(parts[i].l<=0) parts.splice(i,1);
    for(let i=rubble.length-1;i>=0;i--){ rubble[i].l-=dt; if(rubble[i].l<=0) rubble.splice(i,1); }
    g.save(); g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
    const sky=g.createLinearGradient(0,0,0,230); sky.addColorStop(0,'#c9d6e0'); sky.addColorStop(1,'#e8d9b8'); g.fillStyle=sky; g.fillRect(-10,-10,W+20,240);
    g.fillStyle='#8b8680'; for(let k=-1;k<Math.ceil(W/70)+1;k++){ g.beginPath(); g.moveTo(k*70-10,230); g.lineTo(k*70+30,70+(k*37%5)*14); g.lineTo(k*70+80,230); g.fill(); } g.fillStyle='#6e6a64'; for(let k=-1;k<Math.ceil(W/60)+1;k++){ g.beginPath(); g.moveTo(k*60-10,230); g.lineTo(k*60+26,120+(k*53%4)*12); g.lineTo(k*60+66,230); g.fill(); } g.fillStyle='#f3f0e8'; for(let k=0;k<Math.ceil(W/70);k++){ const px=k*70+30, py=70+(k*37%5)*14; g.beginPath(); g.moveTo(px,py); g.lineTo(px+12,py+20); g.lineTo(px-12,py+20); g.fill(); }
    g.fillStyle='#b59b6a'; g.fillRect(-10,220,W+20,H); for(let y=240;y<H;y+=38){ g.fillStyle=(y/38|0)%2?'#a98f5e':'#b59b6a'; g.fillRect(0,y,W,19); }
    g.fillStyle='rgba(0,0,0,.2)'; g.fillRect(0,220,W,10);
    g.fillStyle='#2a2630'; for(const bd of birds){ bd.x+=bd.v*dt; if(bd.x>W+20) bd.x=-20; const fl=Math.sin(t*8+bd.ph)*5; g.beginPath(); g.moveTo(bd.x-8,bd.y+fl); g.lineTo(bd.x,bd.y); g.lineTo(bd.x+8,bd.y+fl); g.lineWidth=2; g.strokeStyle='#2a2630'; g.stroke(); }
    for(const r of rubble){ g.globalAlpha=Math.min(1,r.l); g.fillStyle='rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(r.x+4,r.y+6,r.r,r.r*.5,0,0,7); g.fill(); g.fillStyle='#6f6a62'; g.beginPath(); g.ellipse(r.x,r.y,r.r,r.r*.7,0,0,7); g.fill(); g.fillStyle='#8e8a82'; g.beginPath(); g.ellipse(r.x-4,r.y-4,r.r*.5,r.r*.35,0,0,7); g.fill(); g.globalAlpha=1; }
    for(const r of rocks){ if(r.done) continue; const k=r.life/r.warn; g.fillStyle='rgba(224,72,42,'+(.18+.24*k)+')'; g.beginPath(); g.arc(r.x,r.y,r.r*(.45+.55*k),0,7); g.fill(); g.strokeStyle='#e0482a'; g.lineWidth=3; g.beginPath(); g.arc(r.x,r.y,r.r,0,7); g.stroke(); const fy=r.y-(1-k)*(1-k)*320, sz=r.r*(.4+.35*k); g.fillStyle='#5a564f'; g.beginPath(); g.arc(r.x,fy,sz,0,7); g.fill(); g.fillStyle='#8e8a82'; g.beginPath(); g.arc(r.x-sz*.3,fy-sz*.3,sz*.4,0,7); g.fill(); }
    for(const b of boulders){ if(b.warn>0){ g.fillStyle='rgba(224,72,42,.2)'; g.fillRect(0,b.y-24,W,48); if(Math.floor(b.warn*8)%2){ g.fillStyle='#ff5d4a'; const ax=b.dir>0?24:W-24; g.beginPath(); g.moveTo(ax+b.dir*14,b.y); g.lineTo(ax-b.dir*8,b.y-14); g.lineTo(ax-b.dir*8,b.y+14); g.fill(); } } else { g.save(); g.fillStyle='rgba(0,0,0,.25)'; g.beginPath(); g.ellipse(b.x+6,b.y+20,b.r,b.r*.4,0,0,7); g.fill(); g.translate(b.x,b.y); g.rotate(b.x/20); g.fillStyle='#5f5b55'; g.beginPath(); g.arc(0,0,b.r,0,7); g.fill(); g.fillStyle='#8e8a82'; g.beginPath(); g.arc(-6,-6,8,0,7); g.fill(); g.restore(); } }
    for(const k of pick2){ g.fillStyle='rgba(0,0,0,.2)'; g.beginPath(); g.ellipse(k.x,k.y+10,7,3,0,0,7); g.fill(); coinDraw(g,k.x,k.y-3,t,k.ph); }
    for(const q of parts){ g.fillStyle='#6f6a62'; g.fillRect(q.x,q.y,4,4); }
    villager(g,p.x,p.y,p.fx,p.walk,p.inv,t);
    g.fillStyle='rgba(255,245,220,.5)'; for(const d of dust){ d.x+=d.v*dt; d.y+=Math.sin(t+d.ph)*.2; if(d.x>W+5) d.x=-5; g.beginPath(); g.arc(d.x,d.y,d.r,0,7); g.fill(); }
    g.restore(); vignette(g,W,H,.3); bar(g,W,t/DUR);
  });
  cx.dbg={p,rocks};
}

const STAGES={barn:stageBarn,field:stageField,well:stageWell,bridge:stageBridge,mill:stageMill,woods:stageWoods,bell:stageBell,pass:stageRocks,forge:stageForge,oak:stageOak};

/* ============ finale ============ */
function finale(){
  go('final'); $('#hud').hidden=false;
  const total=STEPS.filter(s=>s.kind!=='final').reduce((a,s)=>a+(S.stars[s.id]||0),0), max=(STEPS.length-1)*3;
  const rank = rankOf(S.points);
  $('#v-final').innerHTML='<canvas id="fc"></canvas><h1>The Marigold Gold!</h1><div class="chest"><div class="gold"></div><div class="base"></div><div class="lid" id="lid"></div></div>'+
    '<div class="page" style="width:100%;max-width:360px"><h2>'+rank+'</h2><p>You followed Grandfather’s trail from the barn to the Big Oak and kept your head when it mattered.</p><div class="facts" style="margin-top:10px"><div><b>'+total+'/'+max+'</b><span>Stars</span></div><div><b>'+S.coins+'</b><span>Coins in purse</span></div><div><b>'+S.points+'</b><span>Reward points</span></div></div></div>'+
    '<div class="rowbtn" style="width:100%;max-width:360px"><button class="btn" id="fMap">Back to map</button><button class="btn alt" id="fNew">New adventure</button></div>';
  setTimeout(()=>{ const l=$('#lid'); if(l) l.style.transform='rotate(-115deg)'; sfx.win(); },300);
  $('#fMap').onclick=()=>{ sfx.tap(); go('map'); };
  $('#fNew').onclick=()=>sheet('<h2>New adventure?</h2><p>This clears your progress and starts again from the barn.</p>',[{label:'Start over',fn:()=>{ S=def(); S.started=true; S.seen=true; persist(); go('map'); }},{label:'Cancel',alt:true}]);
  // coin confetti
  const cv=$('#fc'), g=cv.getContext('2d'); cv.width=cv.clientWidth*2; cv.height=cv.clientHeight*2; g.scale(2,2); const W=cv.clientWidth,H=cv.clientHeight;
  const ps=Array.from({length:60},()=>({x:rnd(0,W),y:rnd(-H,0),v:rnd(80,200),ph:rnd(0,6),s:rnd(5,9)})); let last=performance.now(), t=0;
  const tick=now=>{ if(view!=='final') return; const dt=Math.min(.05,(now-last)/1000); last=now; t+=dt; g.clearRect(0,0,W,H); for(const q of ps){ q.y+=q.v*dt; if(q.y>H+10){ q.y=-10; q.x=rnd(0,W); } coinDraw(g,q.x+Math.sin(t*2+q.ph)*10,q.y,t,q.ph); } requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
